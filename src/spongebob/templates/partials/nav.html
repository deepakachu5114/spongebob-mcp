{% from "partials/icons.html" import icon %}
<header class="sticky top-0 z-40 border-b"
        style="background: #161616; border-color: #393939;">
  <div class="flex w-full items-center px-5 sm:px-8" style="height: 3rem;">

    {# IBM-style product name: "IBM" prefix + product name #}
    <a href="index.html"
       class="flex shrink-0 items-center gap-0 text-sm font-light"
       style="color: #f4f4f4; text-decoration: none;">
      <span style="font-weight: 600;">IBM</span>
      <span style="color: #8d8d8d; padding: 0 0.5rem 0 0.15rem;">|</span>
      <span>{{ meta.title }}</span>
    </a>

    {# right side: mcp-ready pill + theme toggle #}
    <div class="ml-auto flex items-center gap-4">
      <span class="hidden sm:flex items-center gap-2 text-xs uppercase tracking-widest"
            style="color: #8d8d8d; letter-spacing: 0.08em;">
        <span style="width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #24a148;
                     box-shadow: 0 0 0 4px rgba(36,161,72,0.18); display: inline-block;"></span>
        MCP ready
      </span>

      <button type="button" data-theme-toggle
              class="text-xs uppercase tracking-wider"
              style="background: transparent; border: 1px solid #525252; color: #c6c6c6;
                     cursor: pointer; padding: 0.3rem 0.6rem; transition: border-color 0.12s, color 0.12s;"
              aria-label="Toggle colour theme">
        <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        <svg class="hidden w-4 h-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="sb-progress" aria-hidden="true"><span data-scroll-progress></span></div>
</header>
