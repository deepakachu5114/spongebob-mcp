[project]
name = "spongebob"
version = "0.1.0"
description = "MCP server that renders agent-authored JSON into a beautiful multi-page learning website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pygments>=2.18",
]

[project.scripts]
spongebob = "spongebob.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spongebob"]
